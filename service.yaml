name: tg-content-machine-macroservice
client: Toshkent Gullari
owner: Paper Planes
status: draft
created_at: "2026-08-28"

purpose: >
  Macroservice for signal-based content planning, human editing, storyboarding,
  and QA for Toshkent Gullari social content.

google_sheet:
  spreadsheet_id: "1IMIpMSn6VVX64HrmrIBO19xiF0yydKOVL2qaqVwe9UI"
  editor_dashboard:
    sheet_name: "00_Пульт редактора"
    gid: 2001000018
    role: "Daily editor cockpit."
  required_sheets:
    - "00_Пульт редактора"
    - "08_План недели"
    - "05_Сводный план"
    - "04_Аудитории"
    - "06_Правила контента"
    - "07_Банк идей"
    - "IG_*"
  protected_statuses:
    - "Согласовано"
    - "В производстве"
    - "Опубликовано"
  safe_write_mode:
    default: "read_and_recommend"
    allow_automatic_updates_for:
      - draft_future_rows
      - signal_fields
      - rationale_fields
      - qa_status
      - generated_document_links
      - human_review_questions
    require_human_confirmation_for:
      - prices
      - availability
      - promotion_dates
      - branch
      - delivery_terms
      - publication_status

inputs:
  - collect_company_context
  - collect_accounts_and_directions
  - collect_audiences
  - collect_products_and_offers
  - collect_calendar
  - collect_content_rules
  - collect_references_and_examples
  - collect_source_media
  - collect_client_approvals
  - collect_open_questions
  - google_sheet_content_plan
  - finance_signals
  - marketing_signals
  - calendar_events
  - audience_registry
  - idea_bank
  - human_approved_promotions

outputs:
  - weekly_content_plan
  - account_level_ig_plans
  - storyboard_tasks
  - qa_findings
  - human_review_questions
  - folder_structure_map

folder_structure:
  root: TG_Content_Machine
  layers:
    - id: "01_Collect"
      purpose: "Confirmed inputs for content planning."
      children:
        - "01_Company_Context"
        - "02_Accounts_and_Directions"
        - "03_Audiences"
        - "04_Products_and_Offers"
        - "05_Calendar"
        - "06_Content_Rules"
        - "07_References_and_Examples"
        - "08_Source_Media"
        - "09_Client_Approvals"
        - "10_Open_Questions"
    - id: "02_Signals"
      purpose: "Finance, marketing, community, competitor, and dashboard signals."
      children:
        - "01_Finance"
        - "02_Marketing"
        - "03_Community"
        - "04_Competitors"
        - "05_Dashboard_Exports"
        - "06_Signal_Archive"
    - id: "03_Planning"
      purpose: "Monthly frames, weekly plans, daily tasks, idea bank, and approved plan."
      children:
        - "01_Month_Frame"
        - "02_Week_Plans"
        - "03_Daily_Tasks"
        - "04_Idea_Bank"
        - "05_Approved_Plan"
        - "06_Change_Log"
    - id: "04_Production"
      purpose: "Storyboards, shooting tasks, design, montage, subtitles, and covers."
      children:
        - "01_Storyboards"
        - "02_Shooting_Tasks"
        - "03_Design"
        - "04_Montage"
        - "05_Subtitles"
        - "06_Covers"
        - "07_Production_Questions"
    - id: "05_Ready"
      purpose: "Approved materials waiting for publication."
      children:
        - "01_By_Date"
        - "02_By_Account"
        - "03_By_Campaign"
        - "04_Waiting_For_Publication"
    - id: "06_Published"
      purpose: "Published links, screenshots, texts, and reused content."
      children:
        - "01_Links"
        - "02_Screenshots"
        - "03_Post_Texts"
        - "04_Reused_Content"
    - id: "07_Analytics"
      purpose: "Post results, weekly and monthly reviews, learnings, and test results."
      children:
        - "01_Post_Results"
        - "02_Weekly_Review"
        - "03_Monthly_Review"
        - "04_Learnings"
        - "05_Test_Results"
    - id: "08_Methodology"
      purpose: "Skills, prompts, QA checklists, content patterns, research base, and training."
      children:
        - "01_Skills"
        - "02_Prompts"
        - "03_QA_Checklists"
        - "04_Content_Patterns"
        - "05_Research_Base"
        - "06_Training"
    - id: "09_Admin"
      purpose: "Access, roles, process, templates, and archive."
      children:
        - "01_Access"
        - "02_Roles"
        - "03_Process"
        - "04_Templates"
        - "05_Archive"

skills:
  - tg-content-planner
  - tg-storyboard
  - tg-content-qa
  - tg-marketing-orchestrator

guardrails:
  - do_not_invent_prices
  - do_not_invent_availability
  - do_not_invent_branch_or_delivery_terms
  - preserve_manual_edits
  - protect_approved_in_production_and_published_rows
  - human_approval_before_publication
  - no_secrets_in_repository

handoff:
  editor_start: docs/integration.md
  collect_map: docs/collect-and-folder-structure.md
  existing_sheet_binding: docs/existing-sheet-binding.md
  pilot_example: examples/dahlias-pilot.md
  research_base: docs/research-base.md
  app_script_template: apps-script/Code.template.gs
